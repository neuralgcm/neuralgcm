[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "neuralgcm",
    "neuralgcm.base",
    "neuralgcm.classical",
    "neuralgcm.coupled",
    "neuralgcm.hybrid",
    "neuralgcm.legacy",
    "neuralgcm.ml",
]
package-data = {neuralgcm = ["data/*"]}

[project]
name = "neuralgcm"
description = "Neural General Circulation Models for Weather and Climate"
version = "1.2.3"  # keep in sync with __version__ in neuralgcm/__init__.py
authors = [
    {name = "Google LLC", email = "noreply@google.com"},
]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "coordax>=0.2.9",
    "dinosaur>=1.5.1",
    "dm-haiku",
    "flax>=0.12.0",
    "gin-config",
    "jax<0.11.2",
    "jax-datetime>=0.1.2",
    "jaxlib",
    "numpy",
    "optax",
    "pandas",
    "terrax @ git+https://github.com/neuralgcm/terrax.git",
    "xarray",
]

[project.urls]
source = "https://github.com/neuralgcm/neuralgcm"
documentation = "https://neuralgcm.readthedocs.io"

[project.optional-dependencies]
tests = [
    "absl-py",
    "chex",
    "pytest",
]